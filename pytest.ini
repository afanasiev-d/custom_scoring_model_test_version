[pytest]
# Project root on the path so `import bootstrap`, `import scoring`, … resolve
# (the app modules live at the repo root, the tests in tests/).
pythonpath = .
testpaths = tests
addopts = -q --strict-markers
markers =
    slow: end-to-end tests that build a full model (e.g. the Streamlit AppTest); deselect with -m "not slow"
    integration: exercises several modules together rather than a single unit
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
    # calc_iv intentionally computes log(0) on pure bins and replaces ±inf with 0
    ignore:divide by zero encountered in log:RuntimeWarning
